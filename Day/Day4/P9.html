<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS selectors | type selector / element selector</title>
    <style>
        .style1{
            font-size: 14px;
            background-color: rgb(235, 168, 255);
            color: purple;
        }
        .style2{
            color: rgb(255, 0, 0);
        }
        .style3{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
            font-style: italic;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1 class="style1"> class selector</h1>
    <h1 class="style2"> heading tag itself, but different style</h1>
    <p class="style3"> this is a new paragraph that I've created.</p>
    <p class="style2"> this ia a new pararaph that I've created.</p>
</body>
</html>
