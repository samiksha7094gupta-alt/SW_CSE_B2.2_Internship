<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>div and span tags</title>
    <style>
        .card{
            background-color: lightblue;
        }
        .highlight{
            background-color: yellow;
        }
    </style>
</head>
<body>
    <p>div tag:block level element</p>
    <p>span tag:inline level element</p>
    <div class="card"> 
       <h1>product card</h1>
       <p> the product is beautiful and the best part is its <span class="highlight">on sale</span></p>
    </div>
</body>
</html>
