<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript(JS)usage</title>
</head>
<body>
    <!-- inline JS -->
     <button onclick="alert('Hello, I am Samiksha')">Click me</button>
    <!-- internal JS -->
     <button id="internal-js">Click me2</button>
     <script>
        const mybutton = document.getElementById('internal-js');
        mybutton.addEventListener('click', function() {
            alert('Hello, I am Samiksha');
        });
     </script>

</body>
</html>
