<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>href tag</title>
</head>
<body>
    <p> href tag: <a> tag / hyperlink reference</a><p>
    <p> using href tag:
        1. you can create a link to another page or website
        2. you can create a link to other webpage in the same site
    </p>   
    <!--link to external website-->
    <a href="https://www.google.com/">Click here to go to google</a>
    <br>
    <!--link to another page in the same site-->
    <a href="/SW_CSE_B2.2_Internship/Day/Day2/P1.html">Click here to go to P1.html</a>
     <!-- Attribute: target: _blank:opens in a new tab | _self: opens link in same tab |
      _parent: opens the link in the parent frame| _top: opens link in the full body of the window -->
     <a href="https://www.google.com/" target="_blank">_blank: Google.com</a>
     <a href="https://www.google.com/" target="_self">_self: Google.com</a>
     <a href="https://www.google.com/" target="_parent">_parent: Google.com</a>
     <a href="https://www.google.com/" target="_top">_top: Google.com</a>
     <a href="http://" target="_blank" rel="noopener noreferrer"></a>

</body>
</html>
