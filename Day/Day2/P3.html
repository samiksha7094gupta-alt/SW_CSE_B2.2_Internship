<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered list</title>
</head>
<body>
    <p> unordered list:list and group related items for better readability</p>
    <!-- ul: unordered list | li: list item | items are listed with bullets-->
    <ul>
        <li>mango</li>
        <li>apple</li>
        <li>banana</li>
        <li>orange</li>
    </ul>
    <p>ordered list: ol | items are listed with numbers</p>
    <ol>
        <li>laptop</li>
        <li>phone</li>
        <li>tablet</li>
        <li>watch</li>
    </ol>
</body>
</html>
