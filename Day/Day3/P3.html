<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML forms 3</title>
</head>
<body>
    <!--form validation-->
    <form action="" method="post">
        <fieldset>
            <!--fieldset lets us group related elements-->
            <legend>Personal Information</legend>
            <p>
                <input type="text" name="" id="" placeholder="enter your name*" required minlength="8" maxlength="20"><br>
            </p>
            <p>
                <input type="email" name="" id="" placeholder="enter your email*" required><br> 
            </p>
            <p>
                <input type="password" name="" id="" placeholder="enter your password*" required  minlength="8" maxlength="10"><br>
            </p>
            <p>
                <input type="number" name="age" id="" placeholder="enter your age*" min="1" max="90" required><br>
            </p>
            <p>
                <input type="tel" name="phone" id="" placeholder="enter your phone number*" required pattern="[0-9]{10}"><br>
            </p>
            <input type="date" id="DOB" name="DOB" required min="2007-01-01" max="2025-12-31"><br>
        </fieldset>
        <fieldset>
            <legend>preferences</legend>
            <p>
                <input type="radio" name="gender" id="male" value="male">
                <label for="male">Male</label>
                <input type="radio" name="gender" id="female" value="female">
                <label for="female">Female</label>
            </p>
            <p>Skills:</p>
            <p>
                <input type="checkbox" name="skills" id="html" value="html">
                <label for="html">html</label>
                <input type="checkbox" name="skills" id="css" value="css">
                <label for="css">css</label>
                <input type="checkbox" name="skills" id="Javascript" value="Javascript">
                <label for="Javascript">Javascript</label>
                <input type="checkbox" name="skills" id="ReactJS" value="ReactJS">
                <label for="ReactJS">ReactJS</label>
            </p>
            <p>
                <label for="country">Country:</label><br>
                <!-- Dropdown menu -->
                <select name="country" id="country">
                    <option value="">Select your country</option>
                    <option value="india">India</option>
                    <option value="germany">Germany</option>
                    <option value="france">France</option>
                    <option value="usa">USA</option>
                    <option value="uk">UK</option>
                    <option value="canada">Canada</option>
                </select>
            </p>
            <p>
                <label for="message">Message:</label><br>
                <textarea name="message" id="message" row="4" cols="30"></textarea>
            </p>
         </fieldset>

         <p>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
         </p>
        </fieldset>
    </form>
</body>
</html>
