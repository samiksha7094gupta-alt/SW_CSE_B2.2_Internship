<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html tables</title>
</head>
<body>
    <!--table caption-->
    <table border="1">
        <caption>Student Information</caption>
        <thead>
            <tr>
            <th>Sl. no</th>
            <th>Name</th>
        </tr>
        </thead>
        <tbody>
            <tr>
                <th>1</th>
                <td>Samiksha</td>
            </tr>
            <tr>
                <th>2</th>
                <td>Sam</td>
            </tr>
        </tbody>
        <tfoot>
            <td>Total</td>
            <td>2 students</td>
        </tfoot>
    </table>

</body>
</html>
